<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SKYWARD.</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0d14;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    body.idle {
      cursor: none;
    }

    #ui {
      position: fixed;
      right: 0;
      bottom: 3.4vh;
      left: 0;
      display: flex;
      gap: 26px;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.9s ease;
    }

    body.idle #ui {
      opacity: 0.16;
    }

    #ui button {
      padding: 8px 6px;
      border: 0;
      color: rgb(226 232 240 / 36%);
      font: 400 13px/1 "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      background: none;
      cursor: pointer;
      appearance: none;
      transition: color 0.5s ease;
    }

    #ui button:hover {
      color: rgb(226 232 240 / 72%);
    }

    #ui button.on {
      color: rgb(240 246 255 / 94%);
    }

    #ui button:focus-visible {
      outline: 1px solid rgb(226 232 240 / 50%);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div id="ui" role="group" aria-label="天候の切り替え">
    <button id="b-rain" type="button">雨</button>
    <button id="b-snow" type="button">雪</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
