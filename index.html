<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SKYWARD.</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0d14;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    body.idle {
      cursor: none;
    }

    #ui {
      position: fixed;
      right: 0;
      bottom: 3.4vh;
      left: 0;
      display: flex;
      gap: 26px;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.9s ease;
    }

    body.idle #ui,
    body.idle #settings-panel.open {
      opacity: 0.16;
    }

    #ui button {
      padding: 8px 6px;
      border: 0;
      color: rgb(226 232 240 / 36%);
      font: 400 13px/1 "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      background: none;
      cursor: pointer;
      appearance: none;
      transition: color 0.5s ease;
    }

    #ui button:hover {
      color: rgb(226 232 240 / 72%);
    }

    #ui button.on {
      color: rgb(240 246 255 / 94%);
    }

    #ui button:focus-visible {
      outline: 1px solid rgb(226 232 240 / 50%);
      outline-offset: 4px;
    }

    #b-settings {
      letter-spacing: 0.18em;
      text-indent: 0.18em;
    }

    #b-settings[hidden] {
      display: none;
    }

    #settings-panel {
      position: fixed;
      bottom: 9vh;
      left: 50%;
      width: min(280px, calc(100vw - 48px));
      padding: 18px 20px 16px;
      color: rgb(226 232 240 / 62%);
      font: 400 11px/1 "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      letter-spacing: 0.18em;
      background: rgb(10 13 20 / 58%);
      border: 1px solid rgb(226 232 240 / 8%);
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      backdrop-filter: blur(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #settings-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .setting {
      display: grid;
      grid-template-columns: 4em 1fr 4em;
      gap: 12px;
      align-items: center;
    }

    .setting + .setting {
      margin-top: 15px;
    }

    .setting output {
      color: rgb(226 232 240 / 46%);
      text-align: right;
      letter-spacing: 0.04em;
    }

    .setting input {
      width: 100%;
      height: 1px;
      margin: 0;
      background: rgb(226 232 240 / 20%);
      cursor: pointer;
      appearance: none;
    }

    .setting input::-webkit-slider-thumb {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      background: rgb(240 246 255 / 82%);
      appearance: none;
    }

    .setting input::-moz-range-thumb {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      background: rgb(240 246 255 / 82%);
    }

    .setting-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 16px;
      padding: 12px 0 2px;
      border: 0;
      border-top: 1px solid rgb(226 232 240 / 10%);
      color: rgb(226 232 240 / 42%);
      font: inherit;
      letter-spacing: 0.14em;
      text-align: left;
      background: none;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .setting-toggle:hover,
    .setting-toggle.on {
      color: rgb(240 246 255 / 82%);
    }

    .setting-toggle[hidden] {
      display: none;
    }

    .switch-track {
      position: relative;
      width: 28px;
      height: 14px;
      border: 1px solid rgb(226 232 240 / 22%);
      border-radius: 8px;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .switch-track::after {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgb(226 232 240 / 48%);
      content: "";
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .setting-toggle.on .switch-track {
      border-color: rgb(226 232 240 / 52%);
      background: rgb(226 232 240 / 12%);
    }

    .setting-toggle.on .switch-track::after {
      background: rgb(240 246 255 / 92%);
      transform: translateX(14px);
    }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <section id="settings-panel" aria-label="天候の調整" aria-hidden="true">
    <label class="setting">
      <span>量</span>
      <input id="amount" type="range" min="100" max="300" step="5" value="100">
      <output id="amount-value" for="amount">100%</output>
    </label>
    <button id="b-storm" class="setting-toggle" type="button" role="switch" aria-checked="false" hidden>
      <span>雷雨</span>
      <span class="switch-track" aria-hidden="true"></span>
    </button>
  </section>
  <div id="ui" role="group" aria-label="天候の切り替え">
    <button id="b-clear" type="button">晴</button>
    <button id="b-rain" type="button">雨</button>
    <button id="b-snow" type="button">雪</button>
    <button id="b-settings" type="button" aria-controls="settings-panel" aria-expanded="false" aria-label="天候を調整">•••</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
